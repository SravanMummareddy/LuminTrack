name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast, no-database gate: lint, typecheck, unit tests. Always runs.
  unit:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `prisma generate` + module imports don't complain; the
      # unit suite never opens a real connection (the lifecycle tests mock
      # @/server/db). Real URLs are never needed here.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      DIRECT_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  # Integration gate: real Postgres, real Prisma, real cascades.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumintrack_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5433/lumintrack_test
      # The Prisma CLI reads DIRECT_URL for `migrate deploy`.
      DIRECT_URL: postgresql://postgres:postgres@localhost:5433/lumintrack_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/lumintrack_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:integration
